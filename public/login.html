<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voking Online — вход</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #16213e, #0d1117); color: #eaeaea; padding: 20px;
    }
    .card {
      width: 100%; max-width: 380px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 32px 28px; backdrop-filter: blur(4px);
    }
    h1 { text-align: center; font-size: 1.9rem; margin-bottom: 4px; }
    .sub { text-align: center; opacity: 0.6; font-size: 0.9rem; margin-bottom: 22px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 22px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; }
    .tabs button {
      flex: 1; font: inherit; padding: 9px; border: none; border-radius: 9px;
      background: transparent; color: #eaeaea; cursor: pointer; transition: background .2s; opacity: 0.7;
    }
    .tabs button.active { background: #e94560; opacity: 1; font-weight: 600; }

    label { display: block; font-size: 0.8rem; opacity: 0.7; margin: 14px 0 6px; }
    input {
      width: 100%; font: inherit; padding: 11px 14px; border-radius: 11px; color: #fff;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.25);
    }
    input:focus { outline: none; border-color: #e94560; }

    .submit {
      width: 100%; font: inherit; font-weight: 600; margin-top: 22px; padding: 12px;
      border: none; border-radius: 12px; background: #e94560; color: #fff; cursor: pointer; transition: background .2s;
    }
    .submit:hover { background: #ff5670; }
    .submit:disabled { opacity: 0.5; cursor: default; }

    .msg { margin-top: 16px; text-align: center; font-size: 0.85rem; min-height: 1.2em; }
    .msg.error { color: #fb7185; }
    .msg.ok { color: #4ade80; }
    .hint { margin-top: 14px; text-align: center; font-size: 0.72rem; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌍 Voking Online</h1>
    <div class="sub">Вход в общий мир</div>

    <div class="tabs">
      <button id="tabLogin" class="active">Вход</button>
      <button id="tabRegister">Регистрация</button>
    </div>

    <form id="form">
      <label for="username">Имя персонажа</label>
      <input id="username" autocomplete="username" maxlength="16" placeholder="3–16 символов" />

      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="минимум 6 символов" />

      <button class="submit" id="submit" type="submit">Войти</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="hint">Уже есть аккаунт — открой эту страницу и просто войди.</div>
  </div>

  <script>
    // Если уже авторизован — сразу к выбору персонажа
    if (localStorage.getItem('voking_token')) location.href = '/characters.html';

    let mode = 'login';   // 'login' | 'register'
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');

    function setMode(m) {
      mode = m;
      tabLogin.classList.toggle('active', m === 'login');
      tabRegister.classList.toggle('active', m === 'register');
      submit.textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
      document.getElementById('password').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
      msg.textContent = ''; msg.className = 'msg';
    }
    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      msg.textContent = ''; msg.className = 'msg';
      submit.disabled = true;

      try {
        const res = await fetch('/api/' + mode, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (data.error) {
          msg.textContent = data.error;
          msg.className = 'msg error';
        } else {
          msg.textContent = 'Готово! Выбираем персонажа…';
          msg.className = 'msg ok';
          localStorage.setItem('voking_token', data.token);
          localStorage.setItem('voking_account', data.username);
          setTimeout(() => location.href = '/characters.html', 500);
        }
      } catch {
        msg.textContent = 'Ошибка соединения с сервером';
        msg.className = 'msg error';
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById('username').focus();
  </script>
</body>
</html>
