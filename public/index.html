<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voking Online — общий мир</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #0d1117; color: #eaeaea; }

    canvas { display: block; position: fixed; inset: 0; }

    /* --- Экран входа --- */
    #login {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: radial-gradient(circle at 50% 40%, #16213e, #0d1117);
    }
    #login h1 { font-size: 2.4rem; letter-spacing: 1px; }
    #login p { opacity: 0.65; margin-bottom: 8px; }
    #login input {
      font: inherit; padding: 12px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
      color: #fff; width: 260px; text-align: center;
    }
    #login button {
      font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 12px;
      border: none; background: #e94560; color: #fff; cursor: pointer; transition: background .2s;
    }
    #login button:hover { background: #ff5670; }

    /* --- HUD --- */
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(13,17,23,0.7); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 8px 14px; font-size: 0.9rem; pointer-events: none;
    }
    #hud b { color: #4ade80; }

    /* --- Чат --- */
    #chat {
      position: fixed; bottom: 12px; left: 12px; z-index: 10; width: 320px; max-width: 70vw;
    }
    #messages {
      max-height: 160px; overflow-y: auto; margin-bottom: 6px;
      display: flex; flex-direction: column; gap: 3px; font-size: 0.85rem;
    }
    #messages div {
      background: rgba(13,17,23,0.7); border-radius: 8px; padding: 4px 9px; width: fit-content; max-width: 100%;
    }
    #messages .sys { color: #facc15; font-style: italic; }
    #messages .name { color: #38bdf8; font-weight: 600; }
    #chatInput {
      font: inherit; width: 100%; padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(13,17,23,0.85); color: #fff;
    }
    .hint { position: fixed; top: 12px; right: 12px; z-index: 10; font-size: 0.8rem; opacity: 0.55; text-align: right; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="login">
    <h1>🌍 Voking Online</h1>
    <p>Общий мир в реальном времени. Введи имя и заходи.</p>
    <input id="nameInput" maxlength="16" placeholder="Имя персонажа" autocomplete="off" />
    <button id="playBtn">Войти в мир</button>
  </div>

  <div id="hud" style="display:none">
    Игроков онлайн: <b id="count">1</b>
  </div>

  <div class="hint" style="display:none" id="hint">
    Движение: WASD / стрелки<br>Чат: Enter
  </div>

  <div id="chat" style="display:none">
    <div id="messages"></div>
    <input id="chatInput" maxlength="120" placeholder="Написать в чат… (Enter)" autocomplete="off" />
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let world = { width: 2000, height: 2000 };
    let radius = 18;
    let myId = null;

    // Моя локальная позиция (двигаем мгновенно, серверу шлём обновления)
    const me = { x: 0, y: 0, dir: 0 };
    const SPEED = 240;            // пикселей в секунду
    let players = [];             // последний снимок мира с сервера

    const keys = {};

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Подключение -------------------------------------------------------
    let ws;
    function connect(name) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name }));

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'welcome') {
          myId = msg.id;
          world = msg.world;
          radius = msg.radius;
          const self = msg; // позиция придёт со снимком; пока центр мира
          me.x = world.width / 2;
          me.y = world.height / 2;
          startGame();
        } else if (msg.type === 'state') {
          players = msg.players;
          document.getElementById('count').textContent = players.length;
          // синхронизируем нашу серверную позицию при первом снимке
          const mine = players.find(p => p.id === myId);
          if (mine && me.x === world.width / 2 && me.y === world.height / 2 && !me._synced) {
            me.x = mine.x; me.y = mine.y; me._synced = true;
          }
        } else if (msg.type === 'chat') {
          addMessage(msg.from, msg.text);
        }
      };

      ws.onclose = () => addMessage('СИСТЕМА', 'Соединение с сервером потеряно');
    }

    // --- Чат ---------------------------------------------------------------
    const messagesEl = document.getElementById('messages');
    function addMessage(from, text) {
      const div = document.createElement('div');
      if (from === 'СИСТЕМА') {
        div.className = 'sys';
        div.textContent = text;
      } else {
        div.innerHTML = `<span class="name"></span>: `;
        div.querySelector('.name').textContent = from;
        div.appendChild(document.createTextNode(text));
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      while (messagesEl.children.length > 50) messagesEl.removeChild(messagesEl.firstChild);
    }

    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && chatInput.value.trim()) {
        ws.send(JSON.stringify({ type: 'chat', text: chatInput.value.trim() }));
        chatInput.value = '';
        chatInput.blur();
      } else if (e.key === 'Escape') {
        chatInput.blur();
      }
    });

    // --- Управление --------------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === chatInput) return;
      if (e.key === 'Enter') { chatInput.focus(); e.preventDefault(); return; }
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // --- Игровой цикл ------------------------------------------------------
    let lastSent = 0;
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // движение
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;
      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        me.x = Math.max(0, Math.min(world.width, me.x + (dx / len) * SPEED * dt));
        me.y = Math.max(0, Math.min(world.height, me.y + (dy / len) * SPEED * dt));
        me.dir = Math.atan2(dy, dx);
      }

      // отправляем позицию серверу ~20 раз в секунду
      if (ws && ws.readyState === WebSocket.OPEN && now - lastSent > 50) {
        ws.send(JSON.stringify({ type: 'move', x: me.x, y: me.y, dir: me.dir }));
        lastSent = now;
      }

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // камера следует за игроком
      const camX = me.x - canvas.width / 2;
      const camY = me.y - canvas.height / 2;

      // сетка
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      const grid = 100;
      const startX = -((camX % grid) + grid) % grid;
      const startY = -((camY % grid) + grid) % grid;
      for (let x = startX; x < canvas.width; x += grid) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = startY; y < canvas.height; y += grid) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // граница мира
      ctx.strokeStyle = 'rgba(233,69,96,0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(-camX, -camY, world.width, world.height);

      // игроки
      for (const p of players) {
        const x = (p.id === myId ? me.x : p.x) - camX;
        const y = (p.id === myId ? me.y : p.y) - camY;

        // тело
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        if (p.id === myId) { ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(); }

        // «глаз» — направление взгляда
        const dir = p.id === myId ? me.dir : p.dir;
        ctx.beginPath();
        ctx.arc(x + Math.cos(dir) * radius * 0.5, y + Math.sin(dir) * radius * 0.5, radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fill();

        // имя
        ctx.font = '13px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText(p.name, x, y - radius - 6);
      }
    }

    function startGame() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('chat').style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    // --- Вход --------------------------------------------------------------
    const nameInput = document.getElementById('nameInput');
    function play() {
      const name = nameInput.value.trim() || 'Игрок' + Math.floor(Math.random() * 1000);
      connect(name);
    }
    document.getElementById('playBtn').addEventListener('click', play);
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') play(); });
    nameInput.focus();
  </script>
</body>
</html>
