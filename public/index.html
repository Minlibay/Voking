<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voking Online — общий мир</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #0d1117; color: #eaeaea; }

    canvas { display: block; position: fixed; inset: 0; }

    /* --- HUD --- */
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(13,17,23,0.7); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 8px 14px; font-size: 0.9rem; pointer-events: none;
    }
    #hud b { color: #4ade80; }

    /* --- Чат --- */
    #chat {
      position: fixed; bottom: 12px; left: 12px; z-index: 10; width: 320px; max-width: 70vw;
    }
    #messages {
      max-height: 160px; overflow-y: auto; margin-bottom: 6px;
      display: flex; flex-direction: column; gap: 3px; font-size: 0.85rem;
    }
    #messages div {
      background: rgba(13,17,23,0.7); border-radius: 8px; padding: 4px 9px; width: fit-content; max-width: 100%;
    }
    #messages .sys { color: #facc15; font-style: italic; }
    #messages .name { color: #38bdf8; font-weight: 600; }
    #chatInput {
      font: inherit; width: 100%; padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(13,17,23,0.85); color: #fff;
    }
    .hint { position: fixed; top: 12px; right: 12px; z-index: 10; font-size: 0.8rem; opacity: 0.55; text-align: right; }

    /* --- Шкалы выживания --- */
    #survival {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; flex-direction: column; gap: 6px; width: 260px; max-width: 80vw;
    }
    #survival .bar { position: relative; height: 18px; border-radius: 9px; background: rgba(0,0,0,0.55); overflow: hidden; border: 1px solid rgba(255,255,255,0.12); }
    #survival .fill { position: absolute; inset: 0; width: 100%; transform-origin: left; transition: transform .25s linear; }
    #survival .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 600; text-shadow: 0 1px 2px #000; }
    #hpFill { background: linear-gradient(90deg,#ef4444,#f87171); }
    #hungerFill { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
    #thirstFill { background: linear-gradient(90deg,#0891b2,#22d3ee); }
    #energyFill { background: linear-gradient(90deg,#3b82f6,#60a5fa); }

    /* --- Баннер погодного ивента --- */
    #weatherBanner {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 15;
      display: none; text-align: center; padding: 10px 22px; border-radius: 12px;
      background: rgba(20,40,10,0.85); border: 1px solid #65a30d; color: #d9f99d;
      font-weight: 600; text-shadow: 0 1px 3px #000; box-shadow: 0 0 24px rgba(132,204,22,0.4);
      animation: bannerPulse 1.4s ease-in-out infinite;
    }
    #weatherBanner .big { font-size: 1.15rem; }
    #weatherBanner .sub { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }
    @keyframes bannerPulse { 0%,100%{ opacity: 0.85 } 50%{ opacity: 1 } }

    /* --- Тост входа в локацию --- */
    #locToast {
      position: fixed; top: 110px; left: 50%; transform: translateX(-50%); z-index: 14;
      display: none; padding: 8px 20px; border-radius: 10px; font-size: 1.1rem; font-weight: 700;
      background: rgba(13,17,23,0.8); border: 1px solid rgba(255,255,255,0.2);
      text-shadow: 0 2px 6px #000; letter-spacing: 0.5px;
      animation: locFade 2.6s ease forwards;
    }
    @keyframes locFade { 0%{opacity:0;transform:translateX(-50%) translateY(-8px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }

    /* --- Экран смерти --- */
    #death {
      position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; background: rgba(120,0,0,0.45); backdrop-filter: blur(2px);
      animation: deathFade 2.2s ease forwards;
    }
    #death h1 { font-size: 2.6rem; color: #fff; text-shadow: 0 2px 10px #000; }
    #death p { opacity: 0.85; }
    @keyframes deathFade { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" style="display:none">
    <span id="whoami" style="color:#facc15;font-weight:600"></span>
    &nbsp;·&nbsp; Онлайн: <b id="count">1</b>
    &nbsp;·&nbsp; <span id="clock" title="Игровое время">🕛 00:00</span>
    &nbsp;·&nbsp; <span id="weather" title="Погода">☀️ Ясно</span>
    <span id="sick" title="Вы больны" style="display:none;color:#86efac"> · 🤢 Болезнь</span>
    <span id="locHud" style="color:#93c5fd"></span>
    &nbsp; <button id="logoutBtn" style="font:inherit;pointer-events:auto;cursor:pointer;background:rgba(233,69,96,0.25);color:#fff;border:1px solid rgba(233,69,96,0.5);border-radius:7px;padding:2px 8px;font-size:0.78rem">Выйти</button>
  </div>

  <div id="weatherBanner"></div>
  <div id="locToast"></div>

  <div class="hint" style="display:none" id="hint">
    Движение: WASD / стрелки<br>Атака: Пробел · Чат: Enter
  </div>

  <div id="chat" style="display:none">
    <div id="messages"></div>
    <input id="chatInput" maxlength="120" placeholder="Написать в чат… (Enter)" autocomplete="off" />
  </div>

  <div id="survival" style="display:none">
    <div class="bar"><div class="fill" id="hpFill"></div><div class="lbl" id="hpLbl">❤️ 100</div></div>
    <div class="bar"><div class="fill" id="hungerFill"></div><div class="lbl" id="hungerLbl">🍖 100</div></div>
    <div class="bar"><div class="fill" id="thirstFill"></div><div class="lbl" id="thirstLbl">💧 100</div></div>
    <div class="bar"><div class="fill" id="energyFill"></div><div class="lbl" id="energyLbl">⚡ 100</div></div>
  </div>

  <div id="death">
    <h1>💀 Ты не выжил</h1>
    <p>Возрождение…</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let world = { width: 2000, height: 2000 };
    let radius = 18;
    let myId = null;

    // Моя локальная позиция (двигаем мгновенно, серверу шлём обновления)
    const me = { x: 0, y: 0, dir: 0 };
    window.me = me;               // удобно для отладки/тестов из консоли
    const SPEED = 240;            // мировых единиц в секунду
    let players = [];             // последний снимок мира с сервера
    let zombies = [];             // зомби из снимка мира
    let swingUntil = 0;           // до какого времени рисовать взмах атаки
    let hurtUntil = 0;            // до какого времени рисовать «получил урон»
    let weather = { type: 'clear', phase: null, secondsLeft: 0 };
    let shelters = [];            // безопасные зоны (мировые координаты)
    let lightningUntil = 0;       // вспышка молнии в грозу
    const raindrops = [];         // капли дождя (экранные координаты)

    // --- Конфиг мира из админки (земля, объекты, спрайты) ------------------
    let worldConfig = { ground: { colorA: '#1f3d2b', colorB: '#24472f' }, objects: [], playerSprite: null, objectSprites: [] };
    const imgCache = new Map();   // url -> Image
    function getImage(url) {
      if (!url) return null;
      if (imgCache.has(url)) return imgCache.get(url);
      const img = new Image();
      img.src = url;
      imgCache.set(url, img);
      return img;
    }
    function applyWorldConfig(cfg) {
      if (!cfg) return;
      worldConfig = cfg;
      // заранее подгружаем спрайты
      if (cfg.playerSprite) getImage(cfg.playerSprite);
      (cfg.objects || []).forEach(o => getImage('/sprites/objects/' + o.sprite));
    }

    const keys = {};

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Подключение -------------------------------------------------------
    let ws;
    function connect(token, characterId) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => ws.send(JSON.stringify({ type: 'join', token, characterId }));

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'authError') {
          logout();
          return;
        }
        if (msg.type === 'welcome') {
          myId = msg.id;
          world = msg.world;
          radius = msg.radius;
          // сервер прислал сохранённую позицию персонажа
          me.x = msg.x;
          me.y = msg.y;
          applyWorldConfig(msg.config);
          shelters = msg.shelters || [];
          startGame();
        } else if (msg.type === 'state') {
          players = msg.players;
          zombies = msg.zombies || [];
          document.getElementById('count').textContent = players.length;
          const mine = players.find(p => p.id === myId);
          if (mine) {
            document.getElementById('whoami').textContent = mine.name;
            updateSurvivalHud(mine);
            document.getElementById('sick').style.display = mine.sick ? 'inline' : 'none';
          }
          if (msg.time) updateClock(msg.time);
          if (msg.weather) updateWeather(msg.weather);
        } else if (msg.type === 'death') {
          // сервер возродил персонажа — телепортируемся на спаун и показываем экран
          me.x = msg.x; me.y = msg.y;
          showDeath();
        } else if (msg.type === 'hurt') {
          hurtUntil = performance.now() + 250;   // красная вспышка по краям
        } else if (msg.type === 'sick') {
          addMessage('СИСТЕМА', '🤢 Вы простудились! Здоровье будет падать, пока болезнь не пройдёт.');
        } else if (msg.type === 'world') {
          // админ что-то изменил — обновляем мир «вживую»
          applyWorldConfig(msg.config);
        } else if (msg.type === 'chat') {
          addMessage(msg.from, msg.text);
        }
      };

      ws.onclose = () => addMessage('СИСТЕМА', 'Соединение с сервером потеряно');
    }

    // --- Часы и цикл дня/ночи ----------------------------------------------
    let nightDarkness = 0;          // 0 — день, до ~0.6 — глубокая ночь
    function updateClock(time) {
      const hh = String(time.hour).padStart(2, '0');
      const mm = String(time.minute).padStart(2, '0');
      const night = time.hour < 6 || time.hour >= 20;
      const icon = night ? '🌙' : '☀️';
      const phase = night ? 'Ночь' : 'День';
      document.getElementById('clock').textContent = `${icon} ${hh}:${mm} · ${phase}`;
      // высота «солнца»: максимум в полдень (t=0.5), минимум в полночь
      const elevation = Math.sin((time.t - 0.25) * Math.PI * 2);
      nightDarkness = Math.max(0, -elevation) * 0.6;
    }

    // --- Шкалы выживания ---------------------------------------------------
    function setBar(fillId, lblId, icon, value) {
      const v = Math.max(0, Math.min(100, Math.round(value)));
      document.getElementById(fillId).style.transform = `scaleX(${v / 100})`;
      document.getElementById(lblId).textContent = `${icon} ${v}`;
    }
    function updateSurvivalHud(p) {
      setBar('hpFill', 'hpLbl', '❤️', p.health);
      setBar('hungerFill', 'hungerLbl', '🍖', p.hunger);
      setBar('thirstFill', 'thirstLbl', '💧', p.thirst);
      setBar('energyFill', 'energyLbl', '⚡', p.energy);
    }

    // --- Погода ------------------------------------------------------------
    const WEATHER_LABEL = {
      clear: '☀️ Ясно', heat: '🔥 Жара', rain: '🌧️ Гроза', spores: '☠️ Споры',
    };
    function updateWeather(w) {
      weather = w;
      document.getElementById('weather').textContent = WEATHER_LABEL[w.type] || '☀️ Ясно';

      const banner = document.getElementById('weatherBanner');
      if (w.type === 'spores' && w.phase === 'warning') {
        banner.style.display = 'block';
        banner.innerHTML = `<div class="big">☠️ ПРИБЛИЖАЮТСЯ ЯДОВИТЫЕ СПОРЫ</div><div class="sub">Бегите в убежище! До волны: ${w.secondsLeft}с</div>`;
      } else if (w.type === 'spores' && w.phase === 'active') {
        banner.style.display = 'block';
        banner.innerHTML = `<div class="big">☠️ ВОЛНА СПОР — ОСТАВАЙТЕСЬ В УБЕЖИЩЕ</div><div class="sub">Вне убежища — смертельный урон! Осталось: ${w.secondsLeft}с</div>`;
      } else {
        banner.style.display = 'none';
      }
    }

    // --- Локации -----------------------------------------------------------
    let currentLocId = null;
    function locationAt(x, y) {
      for (const l of (worldConfig.locations || [])) {
        if (x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h) return l;
      }
      return null;
    }
    function updateLocation() {
      const l = locationAt(me.x, me.y);
      const id = l ? l.id : null;
      if (id === currentLocId) return;
      currentLocId = id;
      const hud = document.getElementById('locHud');
      if (l) {
        hud.textContent = ' · 📍 ' + l.name;
        const toast = document.getElementById('locToast');
        toast.textContent = '📍 ' + l.name;
        toast.style.color = l.color || '#93c5fd';
        toast.style.display = 'block';
        toast.style.animation = 'none'; void toast.offsetWidth; toast.style.animation = '';
        setTimeout(() => { toast.style.display = 'none'; }, 2600);
      } else {
        hud.textContent = '';
      }
    }
    function showDeath() {
      const el = document.getElementById('death');
      el.style.display = 'flex';
      el.style.animation = 'none';
      void el.offsetWidth;                 // перезапуск анимации
      el.style.animation = '';
      setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    // --- Чат ---------------------------------------------------------------
    const messagesEl = document.getElementById('messages');
    function addMessage(from, text) {
      const div = document.createElement('div');
      if (from === 'СИСТЕМА') {
        div.className = 'sys';
        div.textContent = text;
      } else {
        div.innerHTML = `<span class="name"></span>: `;
        div.querySelector('.name').textContent = from;
        div.appendChild(document.createTextNode(text));
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      while (messagesEl.children.length > 50) messagesEl.removeChild(messagesEl.firstChild);
    }

    const chatInput = document.getElementById('chatInput');
    let chatFocused = false;

    function clearKeys() { for (const k in keys) keys[k] = false; }

    // Пока чат в фокусе — управление не двигает персонажа; клавиши сброшены,
    // чтобы после выхода из чата ничего не «залипало».
    chatInput.addEventListener('focus', () => { chatFocused = true; clearKeys(); });
    chatInput.addEventListener('blur', () => { chatFocused = false; clearKeys(); });

    chatInput.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') {
        const text = chatInput.value.trim();
        if (text) ws.send(JSON.stringify({ type: 'chat', text }));
        chatInput.value = '';
        chatInput.blur();          // всегда возвращаем управление в игру
      } else if (e.key === 'Escape') {
        chatInput.value = '';
        chatInput.blur();
      }
    });

    // --- Управление --------------------------------------------------------
    let lastAttackSent = 0;
    function attack() {
      const now = performance.now();
      if (now - lastAttackSent < 400) return;
      lastAttackSent = now;
      swingUntil = now + 180;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'attack' }));
    }

    window.addEventListener('keydown', (e) => {
      if (chatFocused) return;     // печатаем в чат — не управляем персонажем
      if (e.key === 'Enter') { e.preventDefault(); chatInput.focus(); return; }
      if (e.code === 'Space') { e.preventDefault(); attack(); return; }
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (chatFocused) return;
      keys[e.key.toLowerCase()] = false;
    });
    // Если окно потеряло фокус (alt-tab) — сбрасываем клавиши
    window.addEventListener('blur', clearKeys);

    // --- Игровой цикл ------------------------------------------------------
    let lastSent = 0;
    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // движение: WASD ориентированы по экрану (в изометрии экранные
      // направления = диагонали в мировых координатах)
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup'])    { dx -= 1; dy -= 1; }
      if (keys['s'] || keys['arrowdown'])  { dx += 1; dy += 1; }
      if (keys['a'] || keys['arrowleft'])  { dx -= 1; dy += 1; }
      if (keys['d'] || keys['arrowright']) { dx += 1; dy -= 1; }
      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        me.x = Math.max(0, Math.min(world.width, me.x + (dx / len) * SPEED * dt));
        me.y = Math.max(0, Math.min(world.height, me.y + (dy / len) * SPEED * dt));
        me.dir = Math.atan2(dy, dx);
      }

      updateLocation();   // показываем подсказку при входе в зону

      // отправляем позицию серверу ~20 раз в секунду
      if (ws && ws.readyState === WebSocket.OPEN && now - lastSent > 50) {
        ws.send(JSON.stringify({ type: 'move', x: me.x, y: me.y, dir: me.dir }));
        lastSent = now;
      }

      draw(now);
      requestAnimationFrame(loop);
    }

    // --- Изометрическая проекция -------------------------------------------
    // Мировые координаты (x,y) -> экранные. Соотношение 2:1 (классическая изо).
    const ISO_X = 0.5;    // горизонтальное сжатие
    const ISO_Y = 0.25;   // вертикальное сжатие
    const TILE = 100;     // размер тайла в мировых единицах

    function toIso(wx, wy) {
      return { x: (wx - wy) * ISO_X, y: (wx + wy) * ISO_Y };
    }

    // Состояние анимации по каждому персонажу: фаза шага, факт движения, разворот
    const anim = new Map();   // id -> { phase, lastX, lastY, lastMove, facing }
    let lastDrawTime = performance.now();

    function draw(now) {
      const fdt = Math.min((now - lastDrawTime) / 1000, 0.05);
      lastDrawTime = now;

      // фон-небо
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#1a2238');
      sky.addColorStop(1, '#0d1117');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // камера: центрируем экран на изо-позиции игрока
      const meIso = toIso(me.x, me.y);
      const camX = meIso.x - canvas.width / 2;
      const camY = meIso.y - canvas.height / 2;
      const sx = (wx, wy) => toIso(wx, wy).x - camX;
      const sy = (wx, wy) => toIso(wx, wy).y - camY;

      // --- Земля: ромбовидные тайлы в шахматном порядке --------------------
      const cols = Math.ceil(world.width / TILE);
      const rows = Math.ceil(world.height / TILE);
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const wx = i * TILE, wy = j * TILE;
          // верхняя вершина ромба
          const top = { x: sx(wx, wy), y: sy(wx, wy) };
          // грубый отсев тайлов за пределами экрана
          if (top.x < -TILE || top.x > canvas.width + TILE || top.y < -TILE || top.y > canvas.height + TILE) continue;
          const right = { x: sx(wx + TILE, wy), y: sy(wx + TILE, wy) };
          const bottom = { x: sx(wx + TILE, wy + TILE), y: sy(wx + TILE, wy + TILE) };
          const left = { x: sx(wx, wy + TILE), y: sy(wx, wy + TILE) };

          ctx.beginPath();
          ctx.moveTo(top.x, top.y);
          ctx.lineTo(right.x, right.y);
          ctx.lineTo(bottom.x, bottom.y);
          ctx.lineTo(left.x, left.y);
          ctx.closePath();
          ctx.fillStyle = (i + j) % 2 === 0 ? worldConfig.ground.colorA : worldConfig.ground.colorB;
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // граница мира (ромб по периметру)
      ctx.strokeStyle = 'rgba(233,69,96,0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx(0, 0), sy(0, 0));
      ctx.lineTo(sx(world.width, 0), sy(world.width, 0));
      ctx.lineTo(sx(world.width, world.height), sy(world.width, world.height));
      ctx.lineTo(sx(0, world.height), sy(0, world.height));
      ctx.closePath();
      ctx.stroke();

      // --- Локации (именованные зоны) -------------------------------------
      for (const l of (worldConfig.locations || [])) {
        ctx.beginPath();
        ctx.moveTo(sx(l.x, l.y), sy(l.x, l.y));
        ctx.lineTo(sx(l.x + l.w, l.y), sy(l.x + l.w, l.y));
        ctx.lineTo(sx(l.x + l.w, l.y + l.h), sy(l.x + l.w, l.y + l.h));
        ctx.lineTo(sx(l.x, l.y + l.h), sy(l.x, l.y + l.h));
        ctx.closePath();
        ctx.fillStyle = (l.color || '#38bdf8') + '22';
        ctx.fill();
        ctx.strokeStyle = (l.color || '#38bdf8') + 'aa';
        ctx.lineWidth = 2;
        ctx.stroke();
        // название по центру зоны
        const cxl = sx(l.x + l.w / 2, l.y + l.h / 2);
        const cyl = sy(l.x + l.w / 2, l.y + l.h / 2);
        ctx.font = '600 14px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(l.name, cxl, cyl);
        ctx.fillStyle = '#fff';
        ctx.fillText(l.name, cxl, cyl);
      }

      // --- Убежища (безопасные зоны) --------------------------------------
      const sporeAlert = weather.type === 'spores';
      for (const s of shelters) {
        const cx = sx(s.x, s.y), cy = sy(s.x, s.y);
        const rx = s.r * 0.707, ry = s.r * 0.354;   // проекция круга в изометрию
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (sporeAlert) {
          const pulse = 0.18 + 0.12 * Math.sin(now / 250);
          ctx.fillStyle = `rgba(74,222,128,${pulse})`;
          ctx.strokeStyle = 'rgba(134,239,172,0.9)';
        } else {
          ctx.fillStyle = 'rgba(34,211,238,0.07)';
          ctx.strokeStyle = 'rgba(34,211,238,0.4)';
        }
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '20px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⛺', cx, cy - ry - 2);
      }

      // --- Объекты и персонажи в одном списке, сортировка по глубине -------
      const drawList = [];
      for (const o of (worldConfig.objects || [])) {
        drawList.push({ kind: 'object', o, wx: o.x, wy: o.y, depth: o.x + o.y });
      }
      for (const p of players) {
        const wx = p.id === myId ? me.x : p.x;
        const wy = p.id === myId ? me.y : p.y;
        drawList.push({ kind: 'player', p, wx, wy, depth: wx + wy });
      }
      for (const z of zombies) {
        drawList.push({ kind: 'zombie', z, wx: z.x, wy: z.y, depth: z.x + z.y });
      }
      drawList.sort((a, b) => a.depth - b.depth);   // дальние (меньше x+y) — первыми

      for (const item of drawList) {
        const x = sx(item.wx, item.wy);
        const y = sy(item.wx, item.wy);

        if (item.kind === 'object') {
          drawObject(x, y, item.o);
          continue;
        }

        if (item.kind === 'zombie') {
          const z = item.z;
          let za = anim.get('z' + z.id);
          if (!za) { za = { phase: Math.random() * 6, lastX: item.wx, lastY: item.wy, lastMove: 0, facing: 1 }; anim.set('z' + z.id, za); }
          const zmoved = Math.hypot(item.wx - za.lastX, item.wy - za.lastY);
          if (zmoved > 0.4) {
            za.lastMove = now;
            const svx = (item.wx - za.lastX) - (item.wy - za.lastY);
            if (Math.abs(svx) > 0.01) za.facing = svx < 0 ? -1 : 1;
          }
          za.lastX = item.wx; za.lastY = item.wy;
          const zmoving = (now - za.lastMove) < 200;
          za.phase += fdt * (zmoving ? 7 : 1.5);
          drawCharacter(x, y, '#6b8e23', '', false, za, zmoving, now, z.health);
          continue;
        }

        const p = item.p, wx = item.wx, wy = item.wy;
        // обновляем состояние анимации персонажа
        let a = anim.get(p.id);
        if (!a) { a = { phase: 0, lastX: wx, lastY: wy, lastMove: 0, facing: 1 }; anim.set(p.id, a); }
        const moved = Math.hypot(wx - a.lastX, wy - a.lastY);
        if (moved > 0.4) {
          a.lastMove = now;
          // экранное горизонтальное направление = (dx - dy); по нему разворачиваем
          const screenVx = (wx - a.lastX) - (wy - a.lastY);
          if (Math.abs(screenVx) > 0.01) a.facing = screenVx < 0 ? -1 : 1;
        }
        a.lastX = wx; a.lastY = wy;
        const moving = (now - a.lastMove) < 150;        // «идёт» ещё 150мс после последнего сдвига
        a.phase += fdt * (moving ? 9 : 2.2);            // скорость шага / дыхания

        const sprite = getImage(worldConfig.playerSprite);
        if (sprite && sprite.complete && sprite.naturalWidth > 0) {
          drawSpriteCharacter(x, y, sprite, p.name, p.id === myId, a, moving, now, p.health);
        } else {
          drawCharacter(x, y, p.color, p.name, p.id === myId, a, moving, now, p.health);
        }
      }

      // взмах атаки вокруг своего персонажа
      if (now < swingUntil) {
        const meScreen = { x: sx(me.x, me.y), y: sy(me.x, me.y) };
        const prog = 1 - (swingUntil - now) / 180;
        ctx.save();
        ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - prog)})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(meScreen.x, meScreen.y - radius, radius * 2.2, -0.4 + prog * 3, 0.6 + prog * 3);
        ctx.stroke();
        ctx.restore();
      }

      // подчищаем состояние исчезнувших игроков и зомби
      if (anim.size > players.length + zombies.length + 8) {
        const live = new Set([...players.map(p => p.id), ...zombies.map(z => 'z' + z.id)]);
        for (const id of anim.keys()) if (!live.has(id)) anim.delete(id);
      }

      // затемнение ночью (синеватая вуаль поверх всей сцены)
      if (nightDarkness > 0.01) {
        ctx.fillStyle = `rgba(8, 14, 38, ${nightDarkness})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // погодные эффекты поверх сцены
      drawWeatherFx(now, fdt);

      // вспышка по краям экрана, когда получаешь урон
      if (now < hurtUntil) {
        const a = (hurtUntil - now) / 250;
        const grd = ctx.createRadialGradient(
          canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.3,
          canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.7);
        grd.addColorStop(0, 'rgba(180,0,0,0)');
        grd.addColorStop(1, `rgba(180,0,0,${0.5 * a})`);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    // Погодные эффекты поверх всей сцены
    function drawWeatherFx(now, fdt) {
      const W = canvas.width, H = canvas.height;

      if (weather.type === 'heat') {
        ctx.fillStyle = 'rgba(255, 140, 30, 0.13)';   // тёплая дымка
        ctx.fillRect(0, 0, W, H);
      } else if (weather.type === 'rain') {
        ctx.fillStyle = 'rgba(30, 45, 80, 0.28)';     // сумрак грозы
        ctx.fillRect(0, 0, W, H);
        // капли дождя
        if (raindrops.length === 0) {
          for (let i = 0; i < 140; i++) raindrops.push({ x: Math.random() * W, y: Math.random() * H, s: 480 + Math.random() * 360, l: 10 + Math.random() * 12 });
        }
        ctx.strokeStyle = 'rgba(170, 200, 255, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (const d of raindrops) {
          d.y += d.s * fdt; d.x -= d.s * 0.25 * fdt;
          if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
          ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + d.l);
        }
        ctx.stroke();
        // молнии
        if (Math.random() < 0.006) lightningUntil = now + 110;
        if (now < lightningUntil) {
          ctx.fillStyle = `rgba(255,255,255,${0.45 * ((lightningUntil - now) / 110)})`;
          ctx.fillRect(0, 0, W, H);
        }
      } else {
        if (raindrops.length) raindrops.length = 0;
      }

      if (weather.type === 'spores') {
        const active = weather.phase === 'active';
        // зелёный туман (во время волны — гуще и пульсирует)
        const base = active ? 0.34 + 0.06 * Math.sin(now / 300) : 0.16;
        ctx.fillStyle = `rgba(110, 170, 50, ${base})`;
        ctx.fillRect(0, 0, W, H);
        if (active) {
          const grd = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.7);
          grd.addColorStop(0, 'rgba(40,90,10,0)');
          grd.addColorStop(1, 'rgba(40,90,10,0.55)');
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, W, H);
        }
      }
    }

    // Маленькая полоска здоровья над персонажем (для чужих и при ранении)
    function drawHealthBar(cx, bottomY, health, isMe) {
      if (isMe || health == null || health >= 100) return;
      const w = 34, h = 4, x0 = cx - w / 2, y0 = bottomY - h;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x0 - 1, y0 - 1, w + 2, h + 2);
      ctx.fillStyle = health > 30 ? '#4ade80' : '#ef4444';
      ctx.fillRect(x0, y0, w * Math.max(0, health) / 100, h);
    }

    // Рисует анимированную фигурку: тень, ноги, тело, руки, голова, имя.
    function drawCharacter(x, y, color, name, isMe, a, moving, now, health) {
      const R = radius;
      const f = a.facing;                  // 1 — вправо, -1 — влево

      // покачивание: при ходьбе выше частота, в покое — лёгкое «дыхание»
      const bob = moving ? Math.abs(Math.sin(a.phase)) * R * 0.18
                         : (Math.sin(now / 600) * R * 0.05 + R * 0.05);
      const swing = moving ? Math.sin(a.phase) : 0;   // мах конечностями

      const groundY = y;
      const hipY = y - R * 1.05 - bob;     // таз
      const shoulderY = hipY - R * 0.7;    // плечи
      const headY = shoulderY - R * 0.42;

      const dark = 'rgba(0,0,0,0.45)';
      const line = isMe ? '#fff' : 'rgba(0,0,0,0.5)';

      // тень (сжимается, когда персонаж «подпрыгивает»)
      ctx.beginPath();
      ctx.ellipse(x, groundY, R * (1.05 - bob * 0.01), R * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.33)';
      ctx.fill();

      // --- ноги (машут противофазно) ---
      ctx.lineCap = 'round';
      ctx.lineWidth = R * 0.34;
      ctx.strokeStyle = dark;
      for (const side of [-1, 1]) {
        const sw = swing * side * f;                  // одна нога вперёд, другая назад
        ctx.beginPath();
        ctx.moveTo(x + side * R * 0.22, hipY);
        ctx.lineTo(x + side * R * 0.22 + sw * R * 0.5, groundY - Math.max(0, sw * f) * R * 0.2);
        ctx.stroke();
      }

      // --- тело ---
      ctx.beginPath();
      ctx.moveTo(x - R * 0.55, hipY);
      ctx.lineTo(x - R * 0.7, shoulderY);
      ctx.arc(x, shoulderY, R * 0.7, Math.PI, 0, false);
      ctx.lineTo(x + R * 0.55, hipY);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = isMe ? 3 : 1.5;
      ctx.strokeStyle = line;
      ctx.stroke();

      // --- руки (машут противофазно ногам) ---
      ctx.lineWidth = R * 0.26;
      ctx.strokeStyle = color;
      for (const side of [-1, 1]) {
        const sw = -swing * side * f;
        ctx.beginPath();
        ctx.moveTo(x + side * R * 0.65, shoulderY + R * 0.15);
        ctx.lineTo(x + side * R * 0.75 + sw * R * 0.5, shoulderY + R * 0.8);
        ctx.stroke();
      }

      // --- голова ---
      ctx.beginPath();
      ctx.arc(x, headY, R * 0.46, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = isMe ? 3 : 1.5;
      ctx.strokeStyle = line;
      ctx.stroke();
      // лёгкий «глаз» по направлению взгляда
      ctx.beginPath();
      ctx.arc(x + f * R * 0.16, headY, R * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();

      // --- имя ---
      ctx.font = '13px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(name, x, headY - R * 0.95);
      ctx.fillStyle = '#fff';
      ctx.fillText(name, x, headY - R * 0.95);

      drawHealthBar(x, headY - R * 1.35, health, isMe);
    }

    // Рисует персонажа загруженным спрайтом (билборд) с покачиванием при ходьбе
    function drawSpriteCharacter(x, y, img, name, isMe, a, moving, now, health) {
      const H = radius * 4.2;                          // высота спрайта на экране
      const W = H * (img.naturalWidth / img.naturalHeight);
      const bob = moving ? Math.abs(Math.sin(a.phase)) * radius * 0.22
                         : Math.sin(now / 600) * radius * 0.06;
      const lean = moving ? Math.sin(a.phase) * 0.05 : 0;   // лёгкий наклон при шаге

      // тень
      ctx.beginPath();
      ctx.ellipse(x, y, radius * 1.05, radius * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.33)';
      ctx.fill();

      ctx.save();
      ctx.translate(x, y - bob);
      ctx.rotate(lean);
      ctx.scale(a.facing, 1);                          // разворот по направлению
      if (isMe) { ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 8; }
      ctx.drawImage(img, -W / 2, -H, W, H);            // ноги в точке (x,y)
      ctx.restore();

      ctx.font = '13px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(name, x, y - H - 4);
      ctx.fillStyle = '#fff';
      ctx.fillText(name, x, y - H - 4);

      drawHealthBar(x, y - H - 20, health, isMe);
    }

    // Рисует объект мира (дерево/камень) спрайтом, основанием в точке (x,y)
    function drawObject(x, y, o) {
      const img = getImage('/sprites/objects/' + o.sprite);
      if (!img || !img.complete || !img.naturalWidth) return;
      const H = 120 * (o.scale || 1);
      const W = H * (img.naturalWidth / img.naturalHeight);
      // мягкая тень у основания
      ctx.beginPath();
      ctx.ellipse(x, y, W * 0.28, H * 0.06, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fill();
      ctx.drawImage(img, x - W / 2, y - H, W, H);
    }

    function startGame() {
      document.getElementById('hud').style.display = 'block';
      document.getElementById('chat').style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('survival').style.display = 'flex';
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    // --- Вход по аккаунту и персонажу --------------------------------------
    // authError -> сбрасываем сессию и на страницу входа
    function logout() {
      localStorage.removeItem('voking_token');
      localStorage.removeItem('voking_char');
      location.href = '/login.html';
    }
    // Кнопка «Выйти» возвращает к выбору персонажа (как в WoW)
    document.getElementById('logoutBtn').addEventListener('click', () => {
      location.href = '/characters.html';
    });

    // Требуем токен и выбранного персонажа
    const token = localStorage.getItem('voking_token');
    const charId = localStorage.getItem('voking_char');
    if (!token) {
      location.href = '/login.html';
    } else if (!charId) {
      location.href = '/characters.html';
    } else {
      connect(token, charId);
    }
  </script>
</body>
</html>
