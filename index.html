<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игра «Память»</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-2: #16213e;
      --accent: #e94560;
      --card-back: #0f3460;
      --card-face: #f5f5f5;
      --text: #eaeaea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 16px;
      text-align: center;
      min-width: 92px;
    }
    .stat .label { font-size: 0.72rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 1px; }
    .stat .value { font-size: 1.4rem; font-weight: 700; }

    select, button {
      font: inherit;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    select option { color: #000; }
    button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
    button:hover { background: rgba(255, 255, 255, 0.16); }
    button.primary:hover { background: #ff5670; }
    button:active { transform: scale(0.96); }

    .board {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }
    .card.flipped, .card.matched { transform: rotateY(180deg); }
    .card.matched { cursor: default; }

    .card .side {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      font-size: clamp(1.6rem, 7vw, 2.6rem);
      user-select: none;
    }

    .card .back {
      background: linear-gradient(135deg, var(--card-back), #1b4b8a);
      border: 2px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.35);
    }

    .card .front {
      background: var(--card-face);
      transform: rotateY(180deg);
      border: 2px solid rgba(0, 0, 0, 0.05);
    }

    .card.matched .front {
      box-shadow: 0 0 0 3px #4ade80 inset;
      animation: pop 0.4s ease;
    }
    @keyframes pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.08); } 100% { transform: rotateY(180deg) scale(1); } }

    .win {
      margin-top: 26px;
      text-align: center;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.4);
      border-radius: 16px;
      padding: 20px 28px;
      display: none;
      animation: fade 0.5s ease;
    }
    .win.show { display: block; }
    .win h2 { color: #4ade80; margin-bottom: 6px; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    footer { margin-top: 32px; font-size: 0.8rem; opacity: 0.45; }
  </style>
</head>
<body>
  <h1>🧠 Игра «Память»</h1>
  <p class="subtitle">Находи пары карточек за наименьшее число ходов</p>

  <div class="panel">
    <div class="stat">
      <div class="label">Ходы</div>
      <div class="value" id="moves">0</div>
    </div>
    <div class="stat">
      <div class="label">Пары</div>
      <div class="value" id="pairs">0</div>
    </div>
    <div class="stat">
      <div class="label">Время</div>
      <div class="value" id="time">0:00</div>
    </div>
    <select id="difficulty" title="Сложность">
      <option value="3">Легко (3×4)</option>
      <option value="4" selected>Средне (4×4)</option>
      <option value="5">Сложно (5×4)</option>
    </select>
    <button class="primary" id="restart">🔄 Новая игра</button>
  </div>

  <div class="board" id="board"></div>

  <div class="win" id="win">
    <h2>🎉 Победа!</h2>
    <p id="winText"></p>
  </div>

  <footer>Сделано на чистом HTML, CSS и JavaScript</footer>

  <script>
    const EMOJIS = ['🍎','🍌','🍇','🍓','🍑','🍍','🥝','🍒','🥥','🍉','🍊','🥑'];

    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const timeEl = document.getElementById('time');
    const winEl = document.getElementById('win');
    const winTextEl = document.getElementById('winText');
    const difficultyEl = document.getElementById('difficulty');

    let firstCard = null;
    let lock = false;       // блокировка кликов во время проверки пары
    let moves = 0;
    let matchedPairs = 0;
    let totalPairs = 0;
    let timerId = null;
    let seconds = 0;
    let started = false;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function startTimer() {
      if (started) return;
      started = true;
      timerId = setInterval(() => {
        seconds++;
        timeEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function newGame() {
      // сброс состояния
      clearInterval(timerId);
      firstCard = null;
      lock = false;
      moves = 0;
      matchedPairs = 0;
      seconds = 0;
      started = false;
      movesEl.textContent = '0';
      timeEl.textContent = '0:00';
      winEl.classList.remove('show');

      const cols = parseInt(difficultyEl.value, 10);
      totalPairs = (cols * 4) / 2;
      pairsEl.textContent = `0 / ${totalPairs}`;

      // набор пар
      const picked = shuffle([...EMOJIS]).slice(0, totalPairs);
      const deck = shuffle([...picked, ...picked]);

      boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      boardEl.innerHTML = '';

      deck.forEach(emoji => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.innerHTML = `
          <div class="side back">?</div>
          <div class="side front">${emoji}</div>`;
        card.addEventListener('click', () => onCardClick(card));
        boardEl.appendChild(card);
      });
    }

    function onCardClick(card) {
      if (lock) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      startTimer();
      card.classList.add('flipped');

      if (!firstCard) {
        firstCard = card;
        return;
      }

      // второй клик — это ход
      moves++;
      movesEl.textContent = moves;

      if (firstCard.dataset.emoji === card.dataset.emoji) {
        // пара найдена
        firstCard.classList.add('matched');
        card.classList.add('matched');
        firstCard = null;
        matchedPairs++;
        pairsEl.textContent = `${matchedPairs} / ${totalPairs}`;
        if (matchedPairs === totalPairs) endGame();
      } else {
        // не совпало — переворачиваем обратно
        lock = true;
        const a = firstCard;
        firstCard = null;
        setTimeout(() => {
          a.classList.remove('flipped');
          card.classList.remove('flipped');
          lock = false;
        }, 800);
      }
    }

    function endGame() {
      clearInterval(timerId);
      winTextEl.textContent = `Все пары найдены за ${moves} ходов и ${formatTime(seconds)}.`;
      winEl.classList.add('show');
    }

    document.getElementById('restart').addEventListener('click', newGame);
    difficultyEl.addEventListener('change', newGame);

    newGame();
  </script>
</body>
</html>
